RemoteIPHeader CF-Connecting-IP
ServerTokens Prod
ServerSignature Off

<Files xmlrpc.php>
  Require all denied
</Files>

<Directory /var/www/html/wp-content/uploads>
  AllowOverride None
  <FilesMatch "\.(?i:php\d?|phar|phtml)$">
    Require all denied
  </FilesMatch>
</Directory>

<IfModule mpm_prefork_module>
  StartServers 2
  MinSpareServers 1
  MaxSpareServers 3
  MaxRequestWorkers 6
  MaxConnectionsPerChild 500
</IfModule>
